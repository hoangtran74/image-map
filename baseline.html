const states = {

  "Colorado":"CO","Connecticut":"CT","Delaware":"DE","Florida":"FL","Georgia":"GA",
  "Hawaii":"HI","Idaho":"ID","Illinois":"IL","Indiana":"IN","Iowa":"IA",

  "Massachusetts":"MA","Michigan":"MI","Minnesota":"MN","Mississippi":"MS",
  "Missouri":"MO","Montana":"MT","Nebraska":"NE","Nevada":"NV","New Hampshire":"NH",
  "New Jersey":"NJ","New Mexico":"NM","New York":"NY","North Carolina":"NC",
  "North Dakota":"ND","Ohio":"OH","Oklahoma":"OK","Oregon":"OR","Pennsylvania":"PA",
  "Rhode Island":"RI","South Carolina":"SC","South Dakota":"SD","Tennessee":"TN",
  "Texas":"TX","Utah":"UT","Vermont":"VT","Virginia":"VA","Washington":"WA",
  "West Virginia":"WV","Wisconsin":"WI","Wyoming":"WY"
};

const icons = ["✈️","🛡️"];
const fruits = ["APPLE", "BANANA", "CHERRY"];
const fruits2 = ["GRAPE", "LEMON", "PEAR"];

function abbreviateBase(name) {
  return name
    .replace("Air Force Base", "AFB")
    .replace("Air Base", "AB")
    .replace("Space Force Base", "SFB");
}

function getRandomElement(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function extractUniqueValues(raw, searchValue) {
  if (!raw || raw.trim() === "") {
    return "";
  }

  const rows = raw
    .trim()
    .split("\n")
    .map(line => line.split(",").map(x => x.trim()));

  const map = new Map();

  rows.forEach(([col1, col2, col3]) => {
    if (col3.includes(searchValue.split(/\s+/)[0])) {
      if (!map.has(col1)) {
        map.set(col1, new Set());
      }
      map.get(col1).add(col2);
    }
  });

  let result = "";
  for (const [col2, col3Set] of map.entries()) {
    const list = [...col3Set].join(" ");
    result += `- ${col2}: ${list}\n`;
  }

  return result.trim();
}

document.getElementById("csvFile").addEventListener("change", function (event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = function (e) {
        const text = e.target.result;
        document.getElementById("customerInput").value = text.trim();
    };

    reader.readAsText(file);
});


document.getElementById("clearBtn").addEventListener("click", () => {
    document.getElementById("customerInput").value = "";
});

document.getElementById("runBtn").addEventListener("click", () => {
    const customers = document.getElementById("customerInput").value.trim();
    const skip = parseInt(document.getElementById("skipRows").value, 10);

    const lines = input.split("\n");

    const output = lines
      .slice(skip)
      .map((line, index) => {

        const [name, location, lat, lon] = line.split(",");
        const abbrevName = abbreviateBase(name.trim());
        const stateOrCountry = states[location.trim()] || location.trim();

        const randomIcon = getRandomElement(icons);

        return {
          id: `base-${index + 1 + skip}`,
          lat: parseFloat(lat),
          lon: parseFloat(lon),
          name: `${abbrevName} ${stateOrCountry}`,
          desc: extractUniqueValues(customers, name.trim()),
          cls: "PUBLIC",
          icon: randomIcon
        };
      });

    const rs = {
      markers: output,
      shapes: []
    };

    document.getElementById("showme").value = JSON.stringify(rs, null, 2);
});

document.getElementById("saveBtn").addEventListener("click", () => {
    const text = document.getElementById("showme").value;

    const blob = new Blob([text], { type: "application/json" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "save_output.json";
    a.click();

    URL.revokeObjectURL(url);
});
</script>

</body>
</html>
